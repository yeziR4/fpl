name: Debug faucet claim

# One-off diagnostic: POSTs a real claim to the live faucet Worker for
# a given address and echoes back the raw JSON response, so a "the
# faucet isn't working" report can be checked against what the Worker
# actually says server-side, not guessed at. Manual-only (no schedule,
# no push trigger) -- this can trigger a real payout, so it must never
# run automatically.

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Vara address to test-claim for"
        required: true
      faucet_url:
        description: "Faucet Worker URL"
        required: false
        default: "https://overline-faucet.hassanyezir2002.workers.dev"

permissions:
  contents: read

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - name: POST claim and show the raw response
        run: |
          echo "POSTing to ${{ github.event.inputs.faucet_url }} for address ${{ github.event.inputs.address }}"
          http_code=$(curl -s --max-time 60 -o /tmp/response.json -w "%{http_code}" -X POST "${{ github.event.inputs.faucet_url }}" \
            -H "content-type: application/json" \
            -d "{\"address\":\"${{ github.event.inputs.address }}\"}")
          echo "HTTP status: $http_code"
          echo "Body:"
          cat /tmp/response.json
          echo

      # Diagnostic control: the Worker's own error was "Unable to
      # initialize the API: Invalid array buffer length" -- this
      # connects to the exact same endpoint with the exact same
      # library, but from a plain Node.js process (a real GitHub
      # Actions runner, not a Cloudflare Workers isolate). If this
      # succeeds where the Worker fails, that's strong evidence the
      # problem is specific to the Workers runtime environment, not
      # the chain, the RPC endpoint, or @gear-js/api itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Try the same connection from plain Node.js
        run: |
          npm init -y >/dev/null 2>&1
          npm install @gear-js/api@^0.45.0 >/dev/null 2>&1
          node -e "
          import('@gear-js/api').then(async (m) => {
            try {
              const api = await m.GearApi.create({ providerAddress: 'wss://rpc.vara.network' });
              const chain = (await api.rpc.system.chain()).toString();
              console.log('CONNECTED OK from plain Node -- chain:', chain);
              await api.disconnect();
            } catch (e) {
              console.log('FAILED from plain Node too:', e.message);
              process.exitCode = 1;
            }
          });
          "
