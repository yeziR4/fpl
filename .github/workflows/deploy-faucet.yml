name: Deploy faucet Worker

# Deploys faucet/ (the demo faucet + markets Cloudflare Worker)
# whenever it changes. This deploys CODE ONLY -- CLOUDFLARE_API_TOKEN
# can push a new Worker version, it cannot read or set any key. The
# Worker no longer holds any signing key at all: the actual chain
# interaction lives in chain-signer/ (a small Node.js service on
# Vercel -- see docs/architecture.md for why), and this Worker
# authenticates to it with CHAIN_SIGNER_API_KEY, a Cloudflare Worker
# secret provisioned once directly (`wrangler secret put
# CHAIN_SIGNER_API_KEY`, from their own machine) -- it never becomes a
# GitHub secret, never appears in a workflow run, never touches this
# repo. See docs/architecture.md for the full design and the one-time
# setup this workflow depends on:
#   1. A Cloudflare account, with a Workers KV namespace created for
#      the IP_THROTTLE binding, its id set as the CLOUDFLARE_KV_NAMESPACE_ID
#      repo variable (Settings -> Secrets and variables -> Actions -> Variables).
#   2. A Cloudflare API token (Workers Scripts: Edit) set as the
#      CLOUDFLARE_API_TOKEN repo secret, and the account ID as
#      CLOUDFLARE_ACCOUNT_ID.
#   3. chain-signer/ deployed to Vercel (see chain-signer's own setup
#      notes and docs/architecture.md), its URL set as the
#      CHAIN_SIGNER_URL repo variable, and CHAIN_SIGNER_API_KEY set as
#      a Worker secret directly via Wrangler -- separately from any of
#      the above, and matching the same value set on chain-signer's
#      Vercel project.

on:
  push:
    branches: ["claude/fpl-prediction-market-ajf8qh", "main"]
    paths: ["faucet/**", ".github/workflows/deploy-faucet.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faucet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.x requires Node 22+ -- confirmed the hard way:
          # this was pinned to 20 (copying deploy-web.yml's Next.js
          # requirement) and the first real deploy attempt failed with
          # "Wrangler requires at least Node.js v22.0.0."
          node-version: 22
          cache: npm
          cache-dependency-path: faucet/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Substitute KV namespace ID
        run: |
          if [ -z "${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}" ]; then
            echo "::error::CLOUDFLARE_KV_NAMESPACE_ID repo variable is not set -- create the IP_THROTTLE KV namespace in Cloudflare and set its id as a repo variable first (see docs/architecture.md)."
            exit 1
          fi
          sed -i "s/__KV_NAMESPACE_ID__/${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}/" wrangler.toml

      - name: Substitute chain-signer URL
        run: |
          if [ -z "${{ vars.CHAIN_SIGNER_URL }}" ]; then
            echo "::error::CHAIN_SIGNER_URL repo variable is not set -- deploy chain-signer/ to Vercel first and set its URL as a repo variable (see docs/architecture.md)."
            exit 1
          fi
          # Escape any '/' in the URL for sed's own sake.
          escaped_url=$(printf '%s\n' "${{ vars.CHAIN_SIGNER_URL }}" | sed 's/[\/&]/\\&/g')
          sed -i "s/__CHAIN_SIGNER_URL__/${escaped_url}/" wrangler.toml

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy | tee /tmp/wrangler-deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Couldn't find the deployed Worker's URL in wrangler's output -- deploy may have succeeded but the smoke test below can't run without it."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the live Worker
        # This sandbox's own dev environment can't reach *.workers.dev
        # directly to verify this by hand (same egress restriction that
        # blocks vara.network and gear-tech.io) -- GitHub's runners have
        # real internet, so this is the actual end-to-end check on every
        # deploy, not just "wrangler said success." Only exercises the
        # validation/routing/Durable-Object-reachability path, never a
        # real payout -- no address here is valid enough to reach the
        # signing step.
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "Testing $url"

          # --retry: a brand-new deploy (or, worse, a brand-new
          # workers.dev subdomain) can take a few seconds to propagate
          # across Cloudflare's edge -- confirmed for real, not assumed:
          # the very first version of this smoke test hit the just-
          # deployed URL immediately and got curl's SSL-connect-error
          # (exit 35), which retrying past cleanly fixed.
          # --max-time as defense in depth on top of chain-signer's own
          # request timeouts (see chain-signer/lib/withTimeout.ts) -- a
          # real hang was caught here once already (a garbage extrinsic
          # stalled the old, unguarded MarketLedger for minutes, back
          # when this Worker still did the chain interaction itself);
          # this is what keeps this job itself from ever doing the same
          # regardless of what future bug might reintroduce a stall.
          curl_retry="--retry 5 --retry-delay 3 --retry-all-errors --max-time 20"

          # A code-only deploy (no new subdomain) can *also* take a few
          # seconds to roll out to every edge node -- confirmed for
          # real, a second time: some nodes kept serving the previous
          # deploy's response shape for a few seconds right after this
          # workflow added yesCount/noCount to the totals response.
          # That's a valid 200 with stale content, not a connection
          # error, so curl's own --retry above doesn't catch it --
          # this wrapper does, by re-fetching and re-comparing a few
          # times before actually failing the job.
          check_body() {
            local description="$1" expected="$2"
            shift 2
            local attempt body
            for attempt in 1 2 3 4 5; do
              body=$(curl -s $curl_retry "$@")
              if [ "$body" = "$expected" ]; then
                return 0
              fi
              sleep 3
            done
            echo "::error::$description returned unexpected body after retries: $body"
            return 1
          }

          options_status=$(curl -s $curl_retry -o /dev/null -w "%{http_code}" -X OPTIONS "$url")
          if [ "$options_status" != "200" ]; then
            echo "::error::OPTIONS preflight returned $options_status, expected 200"
            exit 1
          fi

          check_body "POST with no address" '{"error":"address_required"}' \
            -X POST "$url" -H "content-type: application/json" -d '{}' || exit 1

          # Forces a round trip through the Durable Object (address
          # canonicalization happens there) -- confirms FAUCET_LEDGER is
          # actually reachable, not just that the entry Worker boots.
          check_body "POST with an invalid address" '{"error":"invalid_address"}' \
            -X POST "$url" -H "content-type: application/json" -d '{"address":"not-a-real-address"}' || exit 1

          # Markets: GET totals on a market nothing has ever staked on
          # forces a round trip through a *fresh* MarketLedger Durable
          # Object (a brand-new player/gw/threshold combo every run,
          # via the run id, so this never collides with a real market)
          # -- confirms MARKET_LEDGER is reachable and starts at zero,
          # not just that routing to it doesn't 404.
          totals_url="$url/markets/999999999/${{ github.run_id }}/5/totals"
          check_body "GET totals on a fresh market" '{"yesPlanck":"0","noPlanck":"0","yesCount":0,"noCount":0}' \
            "$totals_url" || exit 1

          # POST stake with a garbage extrinsic never reaches the chain --
          # rejected before any broadcast, same as the faucet's invalid-address
          # check above.
          stake_url="$url/markets/999999999/${{ github.run_id }}/5/stake"
          check_body "POST stake with a garbage extrinsic" '{"error":"invalid_extrinsic"}' \
            -X POST "$stake_url" -H "content-type: application/json" -d '{"signedExtrinsicHex":"0xdeadbeef","side":"yes"}' || exit 1

          echo "Smoke test passed: $url"
