name: Diagnose photo URL pattern

# One-off diagnostic, not meant to stay: fetches FPL's own live
# frontend bundle and greps it for how the real site builds player
# photo / team badge URLs, to check our src/lib/fpl.ts pattern against
# ground truth rather than guessing from a blocked-egress sandbox.
# Delete this file once the answer's in.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch FPL homepage and locate script bundles
        run: |
          curl -sS -A "Mozilla/5.0" https://fantasy.premierleague.com/ -o index.html
          echo "bytes: $(wc -c < index.html)"
          grep -oE 'src="[^"]+\.js"' index.html | sed -E 's/src="//; s/"$//' | sort -u > bundles.txt
          echo "--- bundle URLs found ---"
          cat bundles.txt

      - name: Fetch each bundle and grep for premierleague.com asset URL templates
        run: |
          : > findings.txt
          while IFS= read -r url; do
            case "$url" in
              http*) full="$url" ;;
              /*) full="https://fantasy.premierleague.com$url" ;;
              *) full="https://fantasy.premierleague.com/$url" ;;
            esac
            echo "Fetching $full"
            curl -sS -A "Mozilla/5.0" "$full" -o bundle.js || { echo "  (failed)"; continue; }
            echo "  bytes: $(wc -c < bundle.js)"
            grep -aoE '[a-zA-Z0-9_.-]*premierleague\.com/[a-zA-Z0-9_./{}$-]*' bundle.js | sort -u >> findings.txt || true
          done < bundles.txt
          echo "=== ALL premierleague.com asset path templates found across bundles ==="
          sort -u findings.txt

      - name: Grep specifically for photo / badge / image path fragments
        run: |
          echo "=== lines mentioning 'photo' ==="
          grep -i photo findings.txt || echo "(none)"
          echo "=== lines mentioning 'badge' ==="
          grep -i badge findings.txt || echo "(none)"
          echo "=== lines mentioning 'resources' ==="
          grep -i resources findings.txt || echo "(none)"

      - name: Sanity check -- our current pattern against a real player photo
        run: |
          curl -sS -A "Mozilla/5.0" https://fantasy.premierleague.com/api/bootstrap-static/ -o bootstrap.json
          python3 - <<'PY'
          import json
          data = json.load(open("bootstrap.json"))
          # Most expensive player -- highest public profile, most likely to
          # have a recent, well-maintained photo if anyone does.
          e = max(data["elements"], key=lambda x: x["now_cost"])
          print("sample player:", e["web_name"], "cost:", e["now_cost"], "photo:", e["photo"])
          code = e["photo"].rsplit(".", 1)[0]
          print("our current URL:", f"https://resources.premierleague.com/premierleague/photos/players/110x140/p{code}.png")
          PY

      - name: Fetch our current URL for that player and report size/status
        run: |
          CODE=$(python3 -c "
          import json
          data = json.load(open('bootstrap.json'))
          e = max(data['elements'], key=lambda x: x['now_cost'])
          print(e['photo'].rsplit('.', 1)[0])
          ")
          URL="https://resources.premierleague.com/premierleague/photos/players/110x140/p${CODE}.png"
          echo "Checking: $URL"
          curl -sS -o photo.png -D headers.txt "$URL"
          echo "--- response headers ---"
          cat headers.txt
          echo "--- file size ---"
          wc -c < photo.png
          file photo.png
