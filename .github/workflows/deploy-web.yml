name: Deploy web to GitHub Pages

# Builds web/ (Next.js) as a static export and publishes it to GitHub
# Pages. Runs on GitHub's own runners, which -- unlike the sandbox this
# was developed in -- have normal internet access, so this is also the
# first real end-to-end check that the FPL image CDN URLs in
# src/lib/fpl.ts actually resolve. See docs/architecture.md.

on:
  push:
    branches: ["claude/fpl-prediction-market-ajf8qh", "main"]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
  schedule:
    # Static export = data is snapshotted at build time, not fetched
    # per request (see "Hosting: GitHub Pages via Actions" in
    # docs/architecture.md) -- without this, prices/photos/the current
    # gameweek only update on the next code push, which could be days.
    # Every 6 hours keeps it reasonably current without hammering FPL's
    # public API. This does not make the site "live" -- still a
    # snapshot, just a fresher one.
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5
        with:
          # Repo has never had Pages turned on manually -- let this
          # action enable it (via the API, using this workflow's own
          # `pages: write` permission) rather than requiring a manual
          # visit to Settings -> Pages first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
