# Cloudflare Worker: the demo faucet's routing/dedup/state layer.
#
# The actual chain interaction (signing, broadcasting) does NOT happen
# here -- confirmed for real that GearApi.create() cannot initialize
# inside a Cloudflare Workers isolate, so that work lives in
# chain-signer/ (a small Node.js service on Vercel) instead, called
# over an authenticated HTTPS POST. See docs/architecture.md for the
# full story.
#
# Deployed by .github/workflows/deploy-faucet.yml using a
# CLOUDFLARE_API_TOKEN GitHub secret -- that token can push *code*, not
# any key. CHAIN_SIGNER_API_KEY (the shared secret this Worker uses to
# authenticate to chain-signer) is a Cloudflare Worker secret, set once
# directly via `wrangler secret put` -- it never touches this repo,
# GitHub Secrets, or any CI run. See docs/architecture.md for the full
# design and the one-time setup steps.
name = "overline-faucet"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Coarse, non-authoritative IP throttling -- a first-line filter before
# a request ever reaches the Durable Object. Eventually-consistent KV
# is fine here since this isn't the security-critical check (that's the
# Durable Object's own strongly-consistent storage, below).
[[kv_namespaces]]
binding = "IP_THROTTLE"
# Substituted at deploy time from the CLOUDFLARE_KV_NAMESPACE_ID GitHub
# Actions variable (see deploy-faucet.yml) -- not a real ID here, and
# deliberately not committed as one: a namespace ID isn't secret, but
# baking a specific Cloudflare account's resource ID into this file
# would tie the repo to one account for no reason. Create the
# namespace once (`wrangler kv namespace create IP_THROTTLE` or via
# the dashboard) and set its id as that repo variable.
id = "__KV_NAMESPACE_ID__"

# The Durable Object is the actual source of truth: one single global
# instance serializes every claim against the faucet wallet, so two
# near-simultaneous requests can't race the same on-chain nonce or
# double-pay the same address. SQLite-backed (not the legacy KV-backed
# storage API) specifically because that's the variant available on
# Cloudflare's free plan -- confirmed before choosing this design, not
# assumed.
[[durable_objects.bindings]]
name = "FAUCET_LEDGER"
class_name = "FaucetLedger"

# One instance per (player_id, gw, threshold) market -- see
# MarketLedger.ts and index.ts's routing. Unlike FAUCET_LEDGER these
# don't need to serialize against each other (no shared wallet nonce
# to protect), so a global single instance would only add unnecessary
# contention across unrelated markets.
[[durable_objects.bindings]]
name = "MARKET_LEDGER"
class_name = "MarketLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FaucetLedger"]

# A second, separate migration tag -- Cloudflare migrations are
# append-only per class; adding MarketLedger to the already-applied
# "v1" tag isn't how a class introduced after the first deploy gets
# picked up.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["MarketLedger"]

# v3/v4: an unauthorized commit ("Pivot Overline to free-to-play FPL
# league", reverted -- see git log) briefly added and deployed a
# GameLedger Durable Object class for an unrelated architecture pivot.
# Cloudflare's migration history is permanent and append-only once a
# tag has actually been applied to the live script -- confirmed the
# hard way: simply deleting the v3 entry on revert broke every
# subsequent deploy ("Cannot apply new-sqlite-class migration to class
# 'FaucetLedger' that is already depended on by existing Durable
# Objects", since wrangler no longer recognized the script's actual
# migration history and tried to re-run v1 from scratch). v3 must stay
# forever as the historical record of what was actually applied; v4
# is the correct way to retire a class that's no longer wanted --
# marking it deleted, not un-declaring it.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["GameLedger"]

[[migrations]]
tag = "v4"
deleted_classes = ["GameLedger"]

[vars]
# Non-secret configuration. CHAIN_SIGNER_API_KEY is set separately as
# a Worker secret (`wrangler secret put CHAIN_SIGNER_API_KEY`), never here.
PAYOUT_VARA = "10"
MIN_RESERVE_VARA = "5"
ALLOWED_ORIGIN = "https://yezir4.github.io"
IP_RATE_LIMIT_PER_HOUR = "3"
# Where market stakes are sent. A plain address, not a secret -- see
# env.ts. Same address as the faucet wallet for now (see
# docs/architecture.md).
MARKET_POOL_ADDRESS = "kGgVNfy33G9kRscEtXmsffz7HzcBEvN1K9DggnyGj1fzBAkyG"
# Substituted at deploy time from the CHAIN_SIGNER_URL GitHub Actions
# variable (see deploy-faucet.yml) -- not committed as a real URL
# since it depends on the operator's own Vercel project. See
# chain-signer/ and docs/architecture.md for the one-time setup.
CHAIN_SIGNER_URL = "__CHAIN_SIGNER_URL__"
