[project]
name = "fpl-prediction-market-data-pipeline"
version = "0.1.0"
description = "Off-chain data pipeline for an FPL prediction market: FPL API client, snapshot cache, and settlement-fact derivation."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
